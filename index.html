<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExilBatchRuntime</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}
body{background:#000;color:#fff;font-family:"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.aurora{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#008cff66,transparent 60%),radial-gradient(circle at 20% 80%,#ff007066,transparent 60%),radial-gradient(circle at 80% 30%,#9600ff66,transparent 60%);filter:blur(80px);animation:a 12s infinite alternate ease-in-out;pointer-events:none}
@keyframes a{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.1)}100%{transform:translate(-40px,30px) scale(1)}}
.grid{position:fixed;inset:-50%;opacity:.28;pointer-events:none;background-image:linear-gradient(#50a0ff2e 1px,transparent 1px),linear-gradient(90deg,#50a0ff2e 1px,transparent 1px);background-size:55px 55px;transform:perspective(500px) rotateX(58deg);animation:g 8s linear infinite;mask-image:linear-gradient(transparent,#000 35%);-webkit-mask-image:linear-gradient(transparent,#000 35%)}
@keyframes g{to{background-position:0 55px,55px 0}}
.overlay{position:fixed;inset:0;z-index:10;pointer-events:none}
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 30px));height:min(430px,calc(100vh - 30px));min-width:280px;min-height:180px;display:flex;flex-direction:column;overflow:hidden;background:#1b1b1ee0;border:1px solid #ffffff29;border-radius:12px;box-shadow:0 28px 80px #0009,0 0 0 1px #ffffff09;backdrop-filter:blur(28px) saturate(135%);-webkit-backdrop-filter:blur(28px) saturate(135%);pointer-events:auto;user-select:none}
.win.max{left:0!important;top:0!important;width:100vw!important;height:100vh!important;transform:none!important;border-radius:0}
.win.hide{display:none}
.bar{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;background:#ffffff0b;border-bottom:1px solid #ffffff14;cursor:grab;touch-action:none}
.bar:active{cursor:grabbing}
.title{display:flex;align-items:center;gap:10px;padding-left:14px;min-width:0;pointer-events:none}
.icon,.deficon{width:21px;height:21px;flex:0 0 21px;border-radius:5px;object-fit:contain}.icon{display:none}.icon.on{display:block}.deficon{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#eee}
.buttons{height:100%;display:flex}.btn{width:48px;height:100%;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.btn:hover{background:#ffffff1a}.close:hover{background:#e81123}
.min{width:10px;height:1px;background:#fff}.maxi{width:10px;height:10px;border:1px solid #fff}.x{width:12px;height:12px;position:relative}.x:before,.x:after{content:"";position:absolute;left:0;top:5px;width:12px;height:1px;background:#fff}.x:before{transform:rotate(45deg)}.x:after{transform:rotate(-45deg)}
.body{flex:1;min-height:0;overflow:auto;padding:28px;color:#f5f5f5;font-size:clamp(14px,1.5vw,18px);line-height:1.55;overflow-wrap:anywhere;word-break:break-word;user-select:text;-webkit-user-select:text}.body a{color:#62b0ff;text-decoration:underline;text-underline-offset:2px}
.restore,.downloadOpen{position:fixed;z-index:30;left:18px;bottom:18px;border:1px solid #ffffff26;border-radius:999px;padding:9px 14px;color:#fff;background:#1e1e1ed4;backdrop-filter:blur(18px);cursor:pointer}.restore{display:none}.restore.on{display:block}.downloadOpen{z-index:20}
.download{position:fixed;left:18px;bottom:18px;z-index:25;width:min(400px,calc(100vw - 36px));max-height:60vh;display:none;flex-direction:column;padding:16px;border:1px solid #ffffff24;border-radius:16px;background:#141419d4;backdrop-filter:blur(20px);box-shadow:0 18px 50px #0007}.download.on{display:flex}.dh{display:flex;justify-content:space-between;margin-bottom:12px}.dh button{border:0;background:none;color:#fff;font-size:18px;cursor:pointer}.list{overflow:auto;display:flex;flex-direction:column;gap:8px}.card{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border:1px solid #ffffff17;border-radius:10px;background:#ffffff0b}.fname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.dl{border:0;border-radius:8px;padding:7px 10px;background:#2563eb;color:#fff;cursor:pointer}.dl:hover{background:#3b82f6}.msg{font-size:13px;opacity:.7;line-height:1.5}
@media(max-width:600px){.win{width:calc(100vw - 16px);height:calc(100vh - 16px)}.body{padding:20px}.btn{width:44px}}
</style>
</head>
<body>
<div class="aurora"></div><div class="grid"></div>

<div class="overlay" id="overlay" style="display:none">
 <div class="win" id="win">
  <div class="bar" id="bar">
   <div class="title"><div class="deficon" id="deficon"></div><img class="icon" id="icon"><span class="name" id="title">ExilBatchRuntime</span></div>
   <div class="buttons">
    <button class="btn" id="min" title="Réduire"><span class="min"></span></button>
    <button class="btn" id="max" title="Agrandir"><span class="maxi"></span></button>
    <button class="btn close" id="close" title="Fermer"><span class="x"></span></button>
   </div>
  </div>
  <div class="body" id="content"></div>
 </div>
</div>
<button class="restore" id="restore">Afficher la fenêtre</button>

<button class="downloadOpen" id="openDownloads">📦 Téléchargements</button>
<div class="download" id="downloads">
 <div class="dh"><strong>Fichiers .zip</strong><button id="closeDownloads">✕</button></div>
 <div class="list" id="list"><div class="msg">Recherche des fichiers .zip…</div></div>
</div>

<script>
const Q=n=>new URLSearchParams(location.search).get(n);
const overlay=document.getElementById("overlay"),win=document.getElementById("win"),bar=document.getElementById("bar"),content=document.getElementById("content"),icon=document.getElementById("icon"),deficon=document.getElementById("deficon");
function safeUrl(v){try{let u=new URL(v,location.href);return ["http:","https:"].includes(u.protocol)?u.href:null}catch{return null}}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function render(v){let s=esc(v);s=s.replace(/\[url=(https?:\/\/[^"\]\s]+)\]([\s\S]*?)\[\/url\]/gi,(m,u,l)=>{let x=safeUrl(u);return x?`<a href="${esc(x)}" target="_blank" rel="noopener noreferrer">${l}</a>`:l});return s.replace(/\r?\n/g,"<br>")}
const wp=Q("window"),lp=Q("logo");
if(wp){overlay.style.display="block";content.innerHTML=render(wp)}
if(lp){let u=safeUrl(lp);if(u){icon.src=u;icon.classList.add("on");deficon.style.display="none"}}

/* déplacement */
let drag=false,dx=0,dy=0;
function start(x,y){if(win.classList.contains("max"))return;let r=win.getBoundingClientRect();win.style.transform="none";win.style.left=r.left+"px";win.style.top=r.top+"px";dx=x-r.left;dy=y-r.top;drag=true}
function move(x,y){if(!drag)return;let mx=Math.max(0,innerWidth-win.offsetWidth),my=Math.max(0,innerHeight-win.offsetHeight);win.style.left=Math.max(0,Math.min(x-dx,mx))+"px";win.style.top=Math.max(0,Math.min(y-dy,my))+"px"}
bar.addEventListener("mousedown",e=>{if(!e.target.closest("button"))start(e.clientX,e.clientY)});document.addEventListener("mousemove",e=>move(e.clientX,e.clientY));document.addEventListener("mouseup",()=>drag=false);
bar.addEventListener("touchstart",e=>{if(!e.target.closest("button")){let t=e.touches[0];start(t.clientX,t.clientY)}},{passive:true});document.addEventListener("touchmove",e=>{if(drag){let t=e.touches[0];move(t.clientX,t.clientY)}},{passive:true});document.addEventListener("touchend",()=>drag=false);

/* boutons */
let old=null;
document.getElementById("min").onclick=()=>{win.classList.add("hide");document.getElementById("restore").classList.add("on")};
document.getElementById("restore").onclick=()=>{win.classList.remove("hide");document.getElementById("restore").classList.remove("on");overlay.style.display="block"};
document.getElementById("close").onclick=()=>{overlay.style.display="none";document.getElementById("restore").classList.remove("on")};
document.getElementById("max").onclick=()=>{if(!win.classList.contains("max")){let r=win.getBoundingClientRect();old={l:r.left,t:r.top,w:r.width,h:r.height};win.classList.add("max")}else{win.classList.remove("max");if(old){win.style.left=old.l+"px";win.style.top=old.t+"px";win.style.width=old.w+"px";win.style.height=old.h+"px";win.style.transform="none"}}};
bar.addEventListener("dblclick",e=>{if(!e.target.closest("button"))document.getElementById("max").click()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")overlay.style.display="none"});

/* fichiers version/ */
const list=document.getElementById("list");let files=[];
function renderFiles(){list.innerHTML="";if(!files.length){list.innerHTML='<div class="msg">Aucun fichier .zip trouvé dans <b>version/</b>.<br>Le serveur doit autoriser l’affichage du dossier.</div>';return}files.forEach(f=>{let c=document.createElement("div");c.className="card";let n=document.createElement("div");n.className="fname";n.textContent=f;let b=document.createElement("button");b.className="dl";b.textContent="Télécharger";b.onclick=()=>location.href="version/"+encodeURIComponent(f);c.append(n,b);list.append(c)})}
async function loadFiles(){try{let r=await fetch("version/",{cache:"no-store"});if(!r.ok)throw 0;let d=new DOMParser().parseFromString(await r.text(),"text/html");let a=[];d.querySelectorAll("a[href]").forEach(x=>{let h=(x.getAttribute("href")||"").split("?")[0].split("#")[0],v;try{v=decodeURIComponent(h)}catch{return}if(v.toLowerCase().endsWith(".zip")&&!v.includes("/")&&!v.includes("\\"))a.push(v)});files=[...new Set(a)].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));renderFiles()}catch{files=[];renderFiles()}}
document.getElementById("openDownloads").onclick=()=>{document.getElementById("downloads").classList.add("on");document.getElementById("openDownloads").style.display="none"};
document.getElementById("closeDownloads").onclick=()=>{document.getElementById("downloads").classList.remove("on");document.getElementById("openDownloads").style.display="block"};
loadFiles();

/* ?file=nom.zip : attend la découverte puis télécharge */
(async()=>{let f=Q("file");if(!f)return;await loadFiles();let req;try{req=decodeURIComponent(f)}catch{return}let found=files.find(x=>x===req);location.href="version/"+encodeURIComponent(found||req)})();
</script>
</body>
</html>
